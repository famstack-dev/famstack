# Tier 1 of the release gate (docs/agent/dev.md, "Releases"): the checks
# that need no Docker and no macOS, run by script/cibuild. Runs on every
# push/PR; on version tags it additionally enforces that the tag, the CLI
# VERSION, and pyproject.toml all agree. Tiers 2 (integration suite) and 3 (fresh
# install, ai stacklet) stay manual — see docs/cleanup-backlog.md.

name: CI

on:
  push:
    # `feature/**`: an integration branch such as feature/0.5.0-beta.1 takes
    # PRs merged one after another; this checks what they add up to.
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    # `edited` so a description changed after opening is checked again.
    types: [opened, synchronize, reopened, edited]

jobs:
  checks:
    runs-on: ubuntu-latest
    # A normal run takes under 3 minutes. Without a limit, a hung run
    # holds the PR for 6 hours, GitHub's default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Everything the job checks lives in script/cibuild, so it runs
      # the same on a laptop. The PR values are empty on a push.
      - name: script/cibuild
        env:
          GITHUB_REF: ${{ github.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: script/cibuild
