<!doctype html>
<!--
  The dashboard's components, every one in each of its states, on one page.

  For opening from the repository, and for screenshot checks; the tools
  server does not serve it (it is not in dashboard_page._ASSETS). It loads
  the real files by relative path: tokens.css, dashboard.css and
  components/. Chrome refuses ES modules from file:// pages, so open it
  through any local server from the repository's root, for example
  `python3 -m http.server` and then
  /stacklets/core/tools-server/dashboard/gallery.html, or start Chrome with
  --allow-file-access-from-files.

  The URL can pick a state: #theme=light or #theme=dark, and #moment=open,
  #moment=greet or #moment=welcome to show a moment straight away.
  window.gallery.handover() shows a moment and, when its button is pressed,
  plays the page's entrance under its fade, as a page should.

  The words on this page are the gallery's own, in English: components
  never word anything themselves.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Dashboard components · famstack</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* The faces, from the wiki's files in this repository. Declared after
       tokens.css, so these win and its served paths are never asked for. */
    @font-face { font-family: 'Inter Variable'; font-style: normal; font-display: swap; font-weight: 100 900;
      src: url(../../../memory/quartz/static/fonts/inter-latin-wght-normal.woff2) format('woff2-variations');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Inter Variable'; font-style: normal; font-display: swap; font-weight: 100 900;
      src: url(../../../memory/quartz/static/fonts/inter-latin-ext-wght-normal.woff2) format('woff2-variations');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: 'Newsreader Variable'; font-style: normal; font-display: swap; font-weight: 200 800;
      src: url(../../../memory/quartz/static/fonts/newsreader-latin-wght-normal.woff2) format('woff2-variations');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Space Grotesk Variable'; font-style: normal; font-display: swap; font-weight: 300 700;
      src: url(../../../memory/quartz/static/fonts/space-grotesk-latin-wght-normal.woff2) format('woff2-variations');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  </style>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="components/motion.css">
  <link rel="stylesheet" href="components/brand.css">
  <link rel="stylesheet" href="components/button.css">
  <link rel="stylesheet" href="components/field.css">
  <link rel="stylesheet" href="components/moment.css">
  <link rel="stylesheet" href="components/pills.css">
  <link rel="stylesheet" href="components/segmented.css">
  <link rel="stylesheet" href="components/sheet.css">
  <link rel="stylesheet" href="components/steps.css">
  <style>
    /* The gallery's own layout: sections of cards, nothing a component needs. */
    .g-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
             max-width: 1120px; margin: 0 auto; padding: 24px 16px 0; }
    .g-top .fs-seg-row { margin-left: auto; min-width: 260px; }
    .g-main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 28px; }
    .g-section > h2 { margin: 0 0 4px; font: 600 var(--text-xs)/1 var(--grotesk); letter-spacing: 0.09em;
                      text-transform: uppercase; color: var(--accent); }
    .g-section > p { margin: 0 0 12px; max-width: 46em; font-size: var(--text-sm); color: var(--text-muted); }
    .g-cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
    .g-card { container: widget / inline-size; padding: 20px; border-radius: var(--radius-lg);
              background: var(--glass-solid); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); }
    .g-card.wide { grid-column: 1 / -1; }
    .g-card > h3 { margin: 0 0 12px; font: 500 var(--text-sm)/1.3 var(--sans); color: var(--text-muted); }
    .g-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .g-swatch { display: grid; gap: 6px; font-size: var(--text-xs); color: var(--text-muted); }
    .g-swatch i { display: block; width: 72px; height: 40px; border-radius: 10px; border: 1px solid var(--line); }
    .g-scroll { height: 96px; overflow: auto; padding: 0 12px; border-radius: 12px; background: var(--fill);
                font-size: var(--text-sm); color: var(--text-secondary); }
    .g-greeting { margin: 0; font: 500 1.6rem/1.15 var(--serif); letter-spacing: -0.015em; }
    .g-greeting em { font-style: italic; background: linear-gradient(transparent 70%, var(--mark) 70%); }
    .g-narrow { max-width: 300px; }
    .g-stack { display: grid; gap: 16px; }
  </style>
</head>
<body>
  <header class="g-top">
    <span id="brand"></span>
    <span class="label">Components</span>
  </header>
  <main class="g-main" id="page"></main>

  <script type="module">
    import { wordmark } from "./components/brand.js";
    import { kin, loadKinWords, pill, setViewer, viewer } from "./components/family.js";
    import { field } from "./components/field.js";
    import { greeting } from "./components/greeting.js";
    import { showMoment } from "./components/moment.js";
    import { enter, pop } from "./components/motion.js";
    import { segmented } from "./components/segmented.js";
    import { openSheet, sheetContent } from "./components/sheet.js";
    import { steps } from "./components/steps.js";

    const page = document.getElementById("page");
    const hash = new URLSearchParams(location.hash.slice(1));
    const h = (tag, className = "", text = "") =>
      Object.assign(document.createElement(tag), className ? { className } : {}, text ? { textContent: text } : {});
    const section = (title, about, ...cards) => {
      const s = h("section", "g-section");
      s.append(h("h2", "", title), h("p", "", about), Object.assign(h("div", "g-cards"), {}));
      s.lastChild.append(...cards);
      page.append(s);
    };
    const card = (title, wide, ...content) => {
      const c = h("div", wide ? "g-card wide" : "g-card");
      if (title) c.append(h("h3", "", title));
      c.append(...content);
      return c;
    };
    const button = (label, kind, onClick) => {
      const b = h("button", "fs-button", label);
      b.type = "button";
      if (kind) b.dataset.kind = kind;
      if (onClick) b.addEventListener("click", onClick);
      return b;
    };

    // ── The theme ──────────────────────────────────────────────────────────
    const theme = (value) => {
      if (value === "auto") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = value;
    };
    theme(hash.get("theme") || "auto");
    document.getElementById("brand").append(wordmark());
    document.querySelector(".g-top").append(segmented({
      label: "Theme", value: hash.get("theme") || "auto", onChange: theme,
      options: [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]],
    }));

    // ── Foundations ────────────────────────────────────────────────────────
    const swatch = (name) => {
      const s = h("span", "g-swatch");
      const i = h("i");
      i.style.background = `var(${name})`;
      s.append(i, name);
      return s;
    };
    const scroll = h("div", "g-scroll");
    scroll.append(...Array.from({ length: 8 }, (_, i) =>
      h("p", "", `Line ${i + 1}: the quiet scrollbar is thin, the text colour faintly, with no track.`)));
    const ink = h("p", "", "");
    ink.innerHTML = 'famstack will call you <b style="color: var(--lava-ink)">“the Simpsons”</b>, in lava ink. ' +
      '<span style="color: var(--warn)">A warning reads in this colour.</span>';
    section("Foundations", "The tokens added for the components, and the quiet scrollbar (dashboard.css).",
      card("Colours", false, Object.assign(h("div", "g-row"), {}),),
      card("Text on the canvas", false, ink),
      card("The quiet scrollbar", false, scroll));
    page.lastChild.querySelector(".g-row").append(
      ...["--lava", "--lava-ink", "--teal", "--ok", "--warn", "--mark", "--highlight"].map(swatch));

    // ── Brand and buttons ──────────────────────────────────────────────────
    const sizes = h("div", "g-row");
    for (const size of ["1rem", "1.32rem", "2.1rem"]) {
      const mark = wordmark();
      mark.style.fontSize = size;
      sizes.append(mark);
    }
    const kinds = h("div", "g-row");
    const off = button("Let's begin", "go");
    off.disabled = true;
    kinds.append(button("Print sign-in cards"), button("Not now", "soft"), button("Let's begin", "go"), off);
    section("Brand and buttons", "The wordmark as famstack.dev draws it, at three sizes, and the three kinds of button, with a disabled one.",
      card("brand", false, sizes), card("button", false, kinds));

    // ── Pills ──────────────────────────────────────────────────────────────
    await loadKinWords();
    const people = [
      { id: "marge", name: "Marge", tone: 0, relation: "parent", words: "she" },
      { id: "homer", name: "Homer", tone: 1, relation: "parent", words: "he" },
      { id: "lisa", name: "Lisa", tone: 2, relation: "child", words: "she" },
      { id: "bart", name: "Bart", tone: 3, relation: "child", words: "he" },
    ];
    const row = (as, { hint = "", tappable = false } = {}) => {
      const r = h("div", "fs-pills");
      const draw = (who) => {
        r.replaceChildren(...people.map((p) => {
          const b = pill(p, { label: kin(who, p, people), you: p.id === who,
                              title: p.id === who ? "This device greets you" : "Tap if this is you" });
          if (tappable) b.addEventListener("click", () => { setViewer(p.id); draw(p.id); });
          return b;
        }));
        if (!who && hint) r.append(h("span", "fs-pills-hint", hint));
      };
      draw(as);
      r.draw = draw;
      return r;
    };
    const live = row(viewer(), { hint: "Tap your name, and this device greets you", tappable: true });
    const add = button("Add Maggie", "soft", () => {
      if (people.some((p) => p.id === "maggie")) return;
      people.push({ id: "maggie", name: "Maggie", tone: 4, relation: "child", words: "she" });
      live.draw(viewer());
      pop(live.querySelector('[data-person="maggie"]'));
    });
    section("Pills", "The family, labelled relative to whoever is looking (family.js, kin-words.json). The top row is live: tap a name and this device remembers it; Add pops a new pill in.",
      card("Live: whoever this device remembers", true, live, Object.assign(h("div", "g-row"), {}),),
      card("Nobody looking", false, row(null)),
      card("Bart looking", false, row("bart")),
      card("Marge looking", false, row("marge")));
    page.lastChild.querySelector(".g-card .g-row").append(add);

    // ── Greeting ───────────────────────────────────────────────────────────
    const words = { morning: "Good morning", afternoon: "Good afternoon", evening: "Good evening" };
    const said = (date, who) => {
      const { salutation, name } = greeting(words, { ...who, date });
      const line = h("p", "g-greeting", name ? `${salutation}, ` : `${salutation}.`);
      if (name) line.append(Object.assign(h("em"), { textContent: `${name}.` }));
      return line;
    };
    const day = (hour) => new Date(2026, 9, 27, hour);
    const greetings = h("div", "g-stack");
    greetings.append(said(day(8), { name: "Homer" }), said(day(14), { family: "Simpsons" }),
                     said(day(21), {}), said(day(3), { name: "Lisa" }));
    section("Greeting", "By time of day (greeting.js): for whoever is looking, else the family, else no name at all. 8:00, 14:00, 21:00 and 3:00.",
      card("", false, greetings));

    // ── Segmented and field ────────────────────────────────────────────────
    const relation = () => segmented({ label: "In the family", value: "child",
      options: [["parent", "Parent"], ["child", "Child"], ["grandparent", "Grandparent"], ["other", "Other"]] });
    const narrow = h("div", "g-narrow");
    narrow.append(relation(), segmented({ label: "Speak of Lisa as", value: "",
      options: [["she", "she"], ["he", "he"], ["", "name only"]] }));
    section("Segmented", "A radio group with arrow keys. In a narrow container the label sits above and the choices share the width.",
      card("Wide", false, relation(), segmented({ label: "Looks after the server", value: "1", options: [["1", "Yes"], ["", "No"]] })),
      card("Narrow, 300 px", false, narrow));

    const domainHelp = (value) => !value
      ? "If your family owns a web address, everyone signs in with it. If you don't have one, leave this empty."
      : /^([a-z0-9-]+\.)+[a-z]{2,}$/.test(value)
        ? `Everyone signs in with it, you as marge@${value}. It stays for good.`
        : { text: "That doesn't look like a web address yet. It is written like simpsons.com.", tone: "warn" };
    const warned = field({ label: "Your family's web address", optional: "optional", value: "simpsons", help: domainHelp });
    section("Field", "A label, an optional tag, and a help line that follows the value. The underline variant is the moments'.",
      card("Empty, with help", false, field({ label: "Family name", placeholder: "Simpson", help: "famstack will call you the Simpsons." })),
      card("Optional, help that changes", false, field({ label: "Your family's web address", optional: "optional", help: domainHelp })),
      card("A warning", false, warned),
      card("Underline", false, field({ label: "Your first name", placeholder: "Your first name", variant: "underline" })));

    // ── Sheet ──────────────────────────────────────────────────────────────
    const photos = {
      label: "Add to your stack", title: "Photos",
      body: "A private photo library. Every phone backs up its camera roll to this Mac, in full quality.",
      aside: "stack up photos",
    };
    const preview = (options) => {
      const box = h("div", "fs-sheet");
      box.dataset.preview = "";
      box.append(sheetContent(options));
      return box;
    };
    const steps3 = [{ text: "Checking the disk", status: "done" }, { text: "Downloading Immich", status: "now" },
                    { text: "Starting the database" }, { text: "Creating accounts for everyone" }];
    section("Sheet", "A dialog for one task, in its three states, shown in place. Open it to try focus and Esc.",
      card("What it is", false, preview({ ...photos, actions: [{ label: "Not now", kind: "soft" }, { label: "Add Photos", kind: "go" }] })),
      card("Running", false, preview({ ...photos, state: "running", steps: steps3, actions: [{ label: "Close", kind: "soft" }] })),
      card("Done", false, preview({ ...photos, state: "done", done: "Photos is ready. Install the Immich app on each phone.", actions: [{ label: "Done" }] })),
      card("As a dialog", false, button("Open the sheet", "soft", () => openSheet({
        ...photos, actions: [{ label: "Not now", kind: "soft", close: true }, { label: "Add Photos", kind: "go", close: true }] }))));

    // ── Steps ──────────────────────────────────────────────────────────────
    section("Steps", "The setup checklist: done steps ticked, the next one open with a lava ring, a progress row above.",
      card("", true, steps([
        { id: "install", title: "Install famstack", sub: "Done in the terminal, 4 minutes ago", done: true },
        { id: "chat", title: "Sign in to the family chat", sub: "Marge is in, on this Mac", done: true },
        { id: "people", title: "Bring everyone in", sub: "2 of 4 in the chat",
          body: "Everyone installs Element X on their phone and signs in with their first name." },
        { id: "services", title: "Add what your family needs", sub: "Photos, documents, AI, the family memory" },
        { id: "backup", title: "Keep a backup", sub: "A disk, plugged into this Mac" },
      ])));

    // ── Moments and motion ─────────────────────────────────────────────────
    const moments = {
      open: () => showMoment({ line: "hello.", writeBy: "letter", italic: "all",
        sub: "Let's set up your family's own server. What's your name?",
        ask: { label: "Your first name", placeholder: "Your first name", autocomplete: "given-name",
               note: "You'll be the one who looks after it. Everything stays here, on this Mac." },
        button: "Let's begin", leave: false }),
      greet: (name = "Homer") => {
        const { salutation } = greeting(words, { name });
        return showMoment({ line: `${salutation}, ${name}.`, italic: "last",
                            sub: "Nice to meet you.", advanceAfter: 1400 });
      },
      welcome: () => showMoment({ line: "Welcome home, Simpsons.", italic: "last",
        sub: "Your family's server is ready. Everything you add from here stays in this house.",
        button: "Start your journey" }),
    };
    const firstRun = async () => {
      const name = await moments.open();
      await moments.greet(name);
      enter(page);
    };
    const handover = async () => {
      await moments.welcome();
      enter(page);   // with the fade, never after it
    };
    section("Moments and motion", "Full-screen moments (moment.js) and a page's first open (motion.js). With reduced motion they stand still.",
      card("", true, Object.assign(h("div", "g-row"), {})));
    page.lastChild.querySelector(".g-row").append(
      button("The opening, then the greeting", "go", firstRun),
      button("The welcome", "soft", handover),
      button("Play the entrance", "soft", () => enter(page)));

    window.gallery = { handover, moments, enter: () => enter(page) };
    const asked = hash.get("moment");
    if (asked === "open") firstRun();
    else if (asked === "greet") moments.greet().then(() => enter(page));
    else if (asked === "welcome") handover();
    document.documentElement.dataset.ready = "";
  </script>
</body>
</html>
