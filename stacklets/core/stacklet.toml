# core/stacklet.toml — essential services
#
# Watchtower: nightly Docker image updates for all containers.
# Bot runner: discovers and runs bots from enabled stacklets.
# famstack API: Unix socket server for host CLI access from containers.

id          = "core"
name        = "Core"
description = "Auto-updates, bot runner, and API socket"
version     = "0.2.1"
category    = "infrastructure"
type        = "host"
always_on   = true
build       = true

hints = [
    "Containers will auto-update nightly at 3am",
    "Bot runner discovers bots from enabled stacklets",
]

[env]
# Matrix login passwords for the bots core ships. Auto-generated into the
# secret store on `up` so the bot runner can create their accounts.
generate = ["STACKER_BOT_PASSWORD", "MAIL_BOT_PASSWORD"]

[env.defaults]
# 6-field cron: sec min hour day month weekday
WATCHTOWER_SCHEDULE = "0 0 3 * * *"

# Data dir — bot runner mounts this for per-stacklet bot data
DATA_DIR = "{data_dir}"

# Matrix — bot runner connects to Synapse for all bots
MATRIX_HOMESERVER  = "http://stack-messages-synapse:8008"
MATRIX_SERVER_NAME = "{messages_server_name}"

# Admin credentials — for bot account creation
MATRIX_ADMIN_USER     = "{admin_username}"
MATRIX_ADMIN_PASSWORD = "{admin_password}"

# Stacker-bot: only these users can run up/down/restart (comma-separated user IDs)
STACK_ADMIN_USER_IDS = "{admin_user_ids}"

# AI services — bots reach native host services via Docker gateway
OPENAI_URL     = "{ai_openai_url_docker}"
OPENAI_KEY     = "{ai_openai_key}"
WHISPER_URL    = "{ai_whisper_url_docker}/audio/transcriptions"

# Paperless — document search for archivist bot and tools server
PAPERLESS_URL        = "http://stack-docs-paperless:8000"
PAPERLESS_PUBLIC_URL = "{docs_url}"
PAPERLESS_TOKEN      = "{docs__API_TOKEN}"

# Forgejo — archivist bot mirrors classified documents here and links
# memory-vault search results back to the source file. The container
# URL is a literal (no template) so this resolves even when the code
# stacklet hasn't been installed yet — the mirror just fails its
# reachability probe and soft-skips. The public URL is templated and
# resolves to "" when code isn't installed; the search formatter falls
# back to a path-only view in that case.
CODE_URL        = "http://stack-code:3000"
CODE_PUBLIC_URL = "{code_url}"

# Memory — the archivist reads its classifier vocabulary (ontology
# topics + doctypes with synonyms) from the local vault working copy
# the memory stacklet maintains under <data_dir>/memory/vault/. The
# bot-runner container mounts <data_dir> at /data, so the in-container
# path is /data/memory/vault. Missing → seed-only fallback, safe by
# design before memory is installed.
MEMORY_VAULT_DIR = "/data/memory/vault"

# Brain projection working copy — where `stack memory wiki` (run from
# the bot-runner) writes generated pages. The memory stacklet maintains
# it under <data_dir>/memory/brain/ and the curator commits + pushes it;
# the bot-runner mounts <data_dir> at /data, so the in-container path is
# /data/memory/brain.
BRAIN_REPO_DIR = "/data/memory/brain"

# Shared-bucket slug — the entity that owns institutional artifacts
# (documents, correspondents) inside the memory vault. Personal
# entities (homer, marge, …) live at <vault>/<slug>/. Defaults to
# "family"; deskstack or non-family deployments override via
# stack.toml [core] shared_bucket.
SHARED_BUCKET = "{shared_bucket}"

# Persistent links — the resolver in the tools server turns stable
# `<home>/go/docs/<id>`, `<home>/go/topic/<name>`, and `<home>/go/person/<name>`
# links into redirects to wherever the resource lives now, so links posted into
# Matrix never rot. Entities are explicit nouns, so no roster is needed — it
# just needs the *public* (browser-reachable) wiki base; the public Paperless
# URL is already PAPERLESS_PUBLIC_URL above. LINK_PREFIX is the one knob —
# change it to move the whole link namespace.
MEMORY_PUBLIC_URL = "{memory_url}"
LINK_PREFIX       = "go"
# The emitter side of the same namespace: the base a bot prepends to build a
# link it posts into chat (the archivist's "added to the todo list" reply
# points at `{LINK_BASE_URL}/topic/<scope>/todo`). `{home_url}` is core's bare
# home base, mode-correct; the `/go` mirrors LINK_PREFIX above — move one, move both.
LINK_BASE_URL     = "{home_url}/go"

# Immich — photo search for tools server
IMMICH_URL     = "http://stack-photos-server:2283"
IMMICH_API_KEY = "{photos__API_KEY}"

# Tools server port — Open WebUI connects here for tool calling
TOOLS_PORT = "42000"

# Household language — drives bot-side i18n, ontology rendering, and
# any prompt that should be in the family's primary language. Distinct
# from `[ai].language` (`{ai_language}`), which controls AI subsystem
# settings like TTS voice and Whisper transcription language.
LANGUAGE         = "{language}"
AI_DEFAULT_MODEL = "{ai_default_model}"
AI_MODELS_JSON   = "{ai_models_json}"

# Family agent identity (from stack.toml [agent] name). The bot-runner
# expands these into the agent's provision-only bot.toml (${AGENT_BOT_ID},
# ${AGENT_NAME}, ${AGENT_ROOM}) when it mints the account.
AGENT_NAME   = "{agent_name}"
AGENT_BOT_ID = "{agent_handle}"
AGENT_ROOM   = "{agent_room}"

# Mail — the mail bot's accounts, rendered from stack.toml [mail] into one
# JSON env var (host/user/folder/room per account). IMAP passwords are
# pulled from the secret store (mail__<NAME>_IMAP_PASSWORD) and embedded
# here, the same way other container secrets reach .env; they are never
# written to stack.toml. Empty when [mail] has no accounts -> the bot idles.
MAIL_ACCOUNTS_JSON = "{mail_accounts_json}"
MAIL_POLL_INTERVAL = "{mail_poll_interval}"
MAIL_FILTER_NOISE = "{mail_filter_noise}"
