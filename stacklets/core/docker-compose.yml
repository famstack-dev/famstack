# core/docker-compose.yml — essential services
#
# Watchtower: nightly image updates for all containers with
# watchtower.enable=true label. Old images kept for rollback.
#
# Bot runner: discovers bots from enabled stacklets, runs them
# in one async process. Connects to Matrix for messaging, uses
# the API socket for CLI commands.

name: stack-core

services:
  stack-core-watchtower:
    # nickfedor/watchtower is the actively maintained fork. The original
    # containrrr/watchtower was archived in 2024 and ships an old Docker
    # SDK pinned to API v1.25, which modern daemons (incl. OrbStack)
    # reject — the container crashlooped and poisoned core's health.
    image: nickfedor/watchtower:latest
    container_name: stack-core-watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 3 * * *}
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  stack-core-bot-runner:
    build: ./bot-runner
    container_name: stack-core-bot-runner
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - stack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      # Bot discovery — scans enabled stacklets for bot/ dirs
      - ../../stacklets:/stacklets:ro
      # Setup state — knows which stacklets are enabled, holds secrets
      - ../../.stack:/setup-state:ro
      # Shared library — resolve_model, compat shims
      - ../../lib/stack:/app/stack:ro
      # Framework code, live like the library above. The Dockerfile also
      # COPYs these so the image runs standalone, but a bind mount means an
      # edit + restart takes effect without a rebuild — and there is one
      # source of truth instead of a baked /app copy shadowing the mounted
      # tree under /stacklets. Keep this list in sync with the Dockerfile.
      - ../../stacklets/core/bot-runner/main.py:/app/main.py:ro
      - ../../stacklets/core/bot-runner/microbot.py:/app/microbot.py:ro
      - ../../stacklets/core/bot-runner/room_context.py:/app/room_context.py:ro
      - ../../stacklets/core/bot-runner/accounts.py:/app/accounts.py:ro
      # Per-stacklet bot data (sessions, crypto stores)
      - ${DATA_DIR}:/data
      # API is TCP on host.docker.internal:42001 — no socket mount needed
    restart: unless-stopped

  # Tools HTTP server — OpenAPI endpoints for Open WebUI tool calling.
  # Lets the AI search documents, find photos, and check server status.
  stack-core-tools:
    build: ./tools-server
    container_name: stack-core-tools
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - stack
    extra_hosts:
      # TCP API runs natively on macOS, reached via Docker gateway
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "${PORT_BIND_IP:-127.0.0.1}:42000:8000"
    restart: unless-stopped

networks:
  stack:
    external: true
