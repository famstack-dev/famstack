# stacklet.toml — docs stacklet (Paperless-ngx)
#
# Family document archive with OCR, tagging, and full-text search. Drop a
# PDF, photo of a letter, or Office document and Paperless handles the rest:
# OCR, categorisation, and archival as PDF/A for long-term preservation.
#
# Five containers: the web app, Postgres, Redis (task queue), Gotenberg
# (Office → PDF conversion), and Tika (text extraction from email/Office).

id          = "docs"
name        = "Documents"
description = "Digitize, archive, and search all your documents (Paperless-ngx)"
version     = "0.2.1"
category    = "productivity"
port        = 42020

# Next-step hints shown after 'stack up'. Template vars: {url}, {ip}
login_field = "username"

hints = [
    "Open {url}",
]

[upstream]
image   = "ghcr.io/paperless-ngx/paperless-ngx"
channel = "patch"

# Environment variables passed to docker compose on enable.
#
# 'generate' keys are auto-generated and stored in .famstack/secrets.toml.
# 'defaults' are templates rendered against stack.toml values at enable time.
[env]
generate = ["DB_PASSWORD", "SECRET_KEY", "ARCHIVIST_BOT_PASSWORD"]

[env.defaults]
PAPERLESS_DATA_DIR   = "{data_dir}/docs/paperless"
PAPERLESS_DB_DATA    = "{data_dir}/docs/postgres"
PAPERLESS_CONSUME    = "{data_dir}/docs/consume"
TZ                   = "{timezone}"
PAPERLESS_OCR_LANG       = "deu+eng"
PAPERLESS_OCR_IMAGE_DPI  = "300"
DB_USER              = "paperless"
DB_NAME              = "paperless"
# Tech admin account created on first start
ADMIN_USER           = "{admin_username}"
ADMIN_PASSWORD       = "{admin_password}"
PAPERLESS_URL        = "{url}"
LANGUAGE             = "{language}"
# Single sign-on through the id stacklet (Pocket ID). The id stacklet
# creates the client and stores its credentials; without id these
# render empty and the compose file leaves Paperless's login untouched.
OIDC_ISSUER          = "{id_url}"
OIDC_CLIENT_ID       = "{id__CLIENT_DOCS_ID}"
OIDC_CLIENT_SECRET   = "{id__CLIENT_DOCS_SECRET}"

# Declares this stacklet as an OpenID Connect client. 'stack up id'
# creates the client in Pocket ID with these callbacks ({url} is this
# stacklet's public URL) and stores id__CLIENT_DOCS_ID / _SECRET.
[oidc]
name      = "Documents"
callbacks = ["{url}/accounts/oidc/pocketid/login/callback/"]

[health]
url    = "http://localhost:42020/api/"
expect = "200"

# Backup sources declared by this stacklet. See stacklets/backup/README.md
# for how sources flow to configured targets.
#
# We back up paperless/media — the archived PDFs themselves. These are
# the irreplaceable part: scanned letters, contracts, bills.
#
# Postgres is NOT yet backed up here. On host failure you'd recover the
# PDFs but lose tag assignments, correspondents, custom field values,
# manually edited titles, ASNs, saved views, and permissions. Re-running
# OCR rebuilds the search index but not the organization. Pg-dump
# snapshots land via [[backup.snapshot]] later.
[[backup.archive]]
name      = "media"
path      = "{data_dir}/docs/paperless/media"
