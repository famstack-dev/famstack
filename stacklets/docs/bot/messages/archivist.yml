# archivist-bot — User-facing messages in all supported languages
#
# Add a new language by copying the "en" block and translating.
# Use {placeholders} for dynamic values — they're filled in at runtime.
# Multi-line messages use YAML literal block style (|).

en:
  # Startup
  startup: "\u270D\uFE0F The Archivist has returned. Hand me your documents."

  # File upload
  download_failed: "\u274C Failed to download {name}: {error}"
  download_failed_matrix: "\u274C Failed to download {name} from Matrix."

  # Processing
  upload_failed: "\u274C Could not upload {name}. Paperless might be down: try `stack up docs` or check `stack status`."
  reading_classifying: "\U0001F50D Reading text and classifying..."
  ocr_failed: "\u274C Could not process {name} — OCR failed or timed out."
  already_filed: "\U0001F4CE {name} is already filed as #{doc_id} — {title}\n\n  {link}"
  filed_no_details: "\U0001F4C1 Filed: {name} (could not read details)\n\n  {link}"
  filed_no_text: "\U0001F4C1 Filed: {name}\n\n  No text detected — manual tagging needed.\n\n  {link}"
  filed: "\u2705 Filed: {title} (#{doc_id})"
  reprocessed: "\U0001F501 Reclassified with your note: {title} (#{doc_id})"
  reprocessed_capture: "\U0001F501 Reclassified with your note: {title}"
  reprocess_doc_missing: "\u274c Cannot reprocess #{doc_id} \u2014 not found in Paperless."
  reprocess_llm_error: "\u274c Reclassify #{doc_id} failed ({kind}): {detail}"

  # Ollama errors
  llm_unavailable: |
    📁 Filed: {name}

      *AI classification skipped — set up AI with `stack up ai` for automatic tagging.*

      {link}
  llm_model_missing: |
    📁 Filed: {name}

      ⚠️ Model "{model}" is not available.
      Check your AI backend (oMLX, Ollama, etc.)
      Please tag manually in Paperless.

      {link}
  llm_timeout: |
    📁 Filed: {name}

      ⚠️ AI timed out — the model may still be loading.
      Try uploading again in a minute, or tag manually in Paperless.

      {link}
  classify_failed: "\U0001F4C1 Filed: {name}\n\n  Could not classify automatically — please tag in Paperless.\n\n  {link}"

  # Classification summary
  category: "Category: {value}"
  category_new: "Category: {value} (new)"
  person: "Person: {value}"
  type: "Type: {value}"
  type_new: "Type: {value} (new)"
  from: "From: {value}"
  from_new: "From: {value} (new)"
  date: "Date: {value}"
  no_classification: "No classification applied"
  reformat_failed: "Note: text reformatting skipped (timed out) — document is still classified."
  new_in_paperless: "\U0001F195 New in Paperless: {items}"
  added_to_todos: "\U0001F4DD Added to the todo list. Tick it off here:"

  # Scan
  scan_started: "\U0001F4F8 Batch started for {sender}. Send pages, photos, or voice memos, then ) or 'fertig' to combine."
  scan_page_failed: "\u274C Failed to download page: {error}"
  scan_page_failed_matrix: "\u274C Failed to download page from Matrix."
  scan_cancelled: "No pages received — scan cancelled."
  scan_complete_single: "\U0001F4CB Scan complete (1 page) — analyzing..."
  scan_complete_multi: "\U0001F4CB Scan complete — combining {count} pages into PDF..."
  scan_combine_failed: "\u274C Failed to combine pages into PDF: {error}"
  scan_voice_failed: "\u274C Failed to download voice memo: {error}"
  scan_voice_failed_matrix: "\u274C Failed to download voice memo from Matrix."
  scan_voice_no_transcriber: "\U0001F3A4 Voice transcription is not configured. Set up AI with 'stack up ai'."
  scan_voice_empty: "\U0001F3A4 Couldn't hear anything in that voice memo."
  scan_voice_complete: "\U0001F3A4 Combining {count} voice memos into one note. Analyzing..."
  no_active_scan: "No active scan. Send ( or 'scan' to start one."

  # URL archiving
  downloading_google: "\U0001F310 Downloading {type} as PDF..."
  downloading_url: "\U0001F310 Downloading document..."
  url_http_error: "\u274C Failed to download — HTTP {status}.\n  Is the document publicly shared?"
  url_empty: "\u274C Downloaded file is empty."
  url_timeout: "\u274C Download timed out after 60 seconds."
  url_error: "\u274C Failed to download: {error}"
  url_not_pdf: "\u274C URL does not point to a PDF (Content-Type: {content_type}).\n  Currently only PDF links and Google Docs are supported."

  # URL capture (knowledge rooms — links become summarized notes, not Paperless docs)
  capture_failed: "\u274C Couldn't read that link. Either the host is unreachable or there's no article body to extract."
  capture_failed_transcription: "\U0001F3A4 Couldn't transcribe that voice memo. Whisper may be down or misconfigured."
  capture_failed_binary: "\u274C Couldn't read that file."
  capture_llm_failed: "\U0001F4DD Captured the page, but classification skipped: {error}"
  capture_no_mirror: "\u274C Captures need the `code` stacklet up so I can write to the memory vault. Run `stack up code`."
  captured: "\u2705 Captured: {title}"

  # Search
  search_no_results: "\U0001F50D No documents found for \"{query}\"."
  search_results: "\U0001F50D Found {count} document(s) for \"{query}\":"
  search_memory_results: "\U0001F9E0 **Memory** (notes, bookmarks, wiki) for \"{query}\":"
  search_paperless_results: "\U0001F4C1 **Paperless** (source documents) for \"{query}\":"
  search_rewritten: "✨ _Searched for: {keywords}_"
  search_answer: "\U0001F4A1 **Answer:** {answer}"
  search_evidence_header: "\U0001F4DA **Evidence**"
  search_looking_deeper: "\U0001F4D6 I found _{titles}_, let me have a closer look..."

  # Error
  error_processing: "\u274C Error processing file: {error}"
  handler_error: "\u26A0\uFE0F Something went wrong handling that, sorry. React \U0001F501 on the message to try again."
  handler_timeout: "\u23F1\uFE0F That took too long, so I stopped. React \U0001F501 on the message to try again."

  # Welcome / Help
  #
  # The archivist greets every room it joins with a context-aware welcome.
  # `welcome_documents` rides into the configured #documents room (Paperless
  # filing); `welcome_topic` rides into `Thema:`/`Topic:`-prefixed rooms
  # (topic-folder routing); `welcome_personal` rides into DM-shaped rooms;
  # `welcome_capture` is the fallback for any other room the bot is invited
  # to. The `help`/`hilfe` command resolves to the same per-room welcome so
  # the user re-reads exactly what fits where they are asking. `welcome`
  # remains as an alias for `welcome_documents` so legacy callers (and any
  # operator who set `documents_room_alias` to "" to disable Paperless
  # routing) still get a sensible default.
  welcome_documents: |
    📋 **Hi! I'm Archivist!** Your famstack document keeper.

    From now on, I'll take care of your documents. No more digging through drawers or scrolling through photos to find that one receipt from last year.

    **What I can do:**

    - 📷 **Upload a document:** post a photo, PDF, or file here → automatically archived, OCR'd, and tagged
    - 📸 **Multi-page scan:** type `(` then upload pages, then type `)` → combined into one PDF
    - 🌐 **Archive a link:** paste a PDF or Google Docs link → downloaded and archived
    - 🔍 **Search:** type any search term, e.g. "insurance 2024" → full-text search across all documents
    - 📄 **Show document:** `show 42` → fetches the content of document #42

    **💡 Tips:**

    - Use your phone's document scanner for best results!
        - iPhone: Notes app → Camera → Scan Documents
        - Android: Google Drive → + → Scan
    - The scanner auto-crops and enhances contrast: much better than a regular photo
    - For regular photos: good lighting, straight angle, full document in frame

    {ai_status}

    📂 **All documents:** {url}

    ❓ Type **help** or **hilfe** to see this message again.

    **Ready to try? Drop a document here and let's see it in action!**
  welcome: |
    📋 **Hi! I'm Archivist!** Your famstack document keeper.

    From now on, I'll take care of your documents. No more digging through drawers or scrolling through photos to find that one receipt from last year.

    **What I can do:**

    - 📷 **Upload a document:** post a photo, PDF, or file here → automatically archived, OCR'd, and tagged
    - 📸 **Multi-page scan:** type `(` then upload pages, then type `)` → combined into one PDF
    - 🌐 **Archive a link:** paste a PDF or Google Docs link → downloaded and archived
    - 🔍 **Search:** type any search term, e.g. "insurance 2024" → full-text search across all documents
    - 📄 **Show document:** `show 42` → fetches the content of document #42

    {ai_status}

    📂 **All documents:** {url}

    ❓ Type **help** or **hilfe** to see this message again.

    **Ready to try? Drop a document here and let's see it in action!**
  welcome_topic: |
    📁 **Hi! I'm Archivist.** I file everything you drop in this room under the **{display}** topic.

    **What I'll do here:**

    - 🔗 **Links:** paste a URL → filed under `{bucket}/` with the `{slug}` tag
    - 📌 **Notes:** react 📌 to any message to keep it (in a room with just you, a long paste is kept on its own)
    - 🎤 **Voice memos:** record straight from the chat → transcribed + filed
    - 📷 **Photos & PDFs:** drop any file → text-extracted, summarised, and filed
    - 🎤 **Multi-memo notes:** type `(` then send multiple voice memos, then `)` → combined into one note
    - 🔍 **Search this topic:** start a message with `?` (e.g. `?how did we pack the trunk last trip`) → I search only this topic's folder

    Every capture in this room is tagged `{slug}` automatically, so the wiki's **{display}** page accumulates everything in one place.

    Drop something to try it out!
  welcome_personal: |
    📝 **Hi! I'm Archivist.** This is your personal capture surface.

    **What I'll do here:**

    - 📝 **Notes & links:** paste text or paste a URL → filed under your personal bucket
    - 🎤 **Voice memos:** record straight from the chat → transcribed + filed
    - 📷 **Photos & PDFs:** drop any file → text-extracted, summarised, and filed
    - 🔍 **Ask me anything:** start a message with `?` (e.g. `?when does our car insurance expire`) → I search your captures and our household documents

    Type **help** to see this message again.

    Drop something to try it out!
  welcome_capture: |
    📝 **Hi! I'm Archivist.** I capture what your family drops here.

    **What I'll do here:**

    - 🔗 **Links:** paste a URL → summarised and filed under the sender's bucket
    - 📌 **Notes:** react 📌 to any message to keep it (in a room with just you, a long paste is kept on its own)
    - 🎤 **Voice memos:** record straight from the chat → transcribed + filed
    - 📷 **Photos & PDFs:** drop any file → text-extracted, summarised, and filed
    - 🔍 **Ask me anything:** start a message with `?` (e.g. `?did we get the dentist confirmation`) → I search captures and documents

    Type **help** to see this message again.

    **Pro tip:** create a `Thema: <name>` room (e.g. `Thema: Camping`) and invite me — everything you drop there will be organised under that topic automatically.

