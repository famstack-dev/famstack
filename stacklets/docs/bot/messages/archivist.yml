  welcome_topic: |
    📁 **Hallo! Ich bin Archivist.** Hier sammle ich alles unter dem Thema **{display}**.

    **Was ich hier mache:**

    - 🔗 **Links:** URL einfügen → wird unter `{bucket}/` mit dem Tag `{slug}` abgelegt
    - 📌 **Notizen:** mit 📌 auf eine Nachricht reagieren, dann merke ich sie mir (bist du allein im Raum, wird ein langer Text automatisch abgelegt)
    - 🎤 **Sprachnachrichten:** direkt im Chat aufnehmen → wird transkribiert und abgelegt
    - 📷 **Fotos & PDFs:** beliebige Datei droppen → Text wird extrahiert, zusammengefasst und abgelegt
    - 🎤 **Mehrere Sprachnachrichten:** `(` tippen, mehrere Memos senden, dann `)` → werden zu einer Notiz kombiniert
    - 🔍 **In diesem Thema suchen:** Nachricht mit `?` beginnen (z.B. `?wie haben wir letztes Mal die Kisten gepackt`) → ich suche nur in diesem Topic-Ordner

    Jeder Eintrag in diesem Raum wird automatisch mit `{slug}` getaggt, damit die **{display}**-Wiki-Seite alles an einem Ort sammelt.

    Wirf was rein zum Ausprobieren!
  welcome_personal: |
    📝 **Hallo! Ich bin Archivist.** Das ist deine persönliche Capture-Fläche.

    **Was ich hier mache:**

    - 📝 **Notizen & Links:** Text einfügen oder URL pasten → wird in deinem persönlichen Bucket abgelegt
    - 🎤 **Sprachnachrichten:** direkt im Chat aufnehmen → wird transkribiert und abgelegt
    - 📷 **Fotos & PDFs:** beliebige Datei droppen → Text wird extrahiert, zusammengefasst und abgelegt
    - 🔍 **Frag mich was:** Nachricht mit `?` beginnen (z.B. `?wann läuft die KFZ-Versicherung ab`) → ich durchsuche deine Captures und unsere Dokumente

    **help** tippen für diese Nachricht.

    Wirf was rein zum Ausprobieren!
  welcome_capture: |
    📝 **Hallo! Ich bin Archivist.** Ich sammle alles, was eure Familie hier droppt.

    **Was ich hier mache:**

    - 🔗 **Links:** URL einfügen → wird zusammengefasst und im Bucket des Absenders abgelegt
    - 📌 **Notizen:** mit 📌 auf eine Nachricht reagieren, dann merke ich sie mir (bist du allein im Raum, wird ein langer Text automatisch abgelegt)
    - 🎤 **Sprachnachrichten:** direkt im Chat aufnehmen → wird transkribiert und abgelegt
    - 📷 **Fotos & PDFs:** beliebige Datei droppen → Text wird extrahiert, zusammengefasst und abgelegt
    - 🔍 **Frag mich was:** Nachricht mit `?` beginnen (z.B. `?haben wir die Zahnarzt-Bestätigung bekommen`) → ich durchsuche Captures und Dokumente

    **help** tippen für diese Nachricht.

    **Profi-Tipp:** Erstellt einen Raum mit dem Präfix `Thema:` (z.B. `Thema: Camping`) und ladet mich ein — alles dort wird automatisch unter diesem Thema organisiert.
