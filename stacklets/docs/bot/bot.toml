id          = "archivist-bot"
name        = "Archivist"
description = "Auto-files documents with AI classification"
room        = "documents"
room_topic  = "Drop photos, PDFs, or links here. They get filed and tagged automatically. Type 'help' for tips."

[settings]
classify = true
reformat = true

# Max OCR chars passed to the classifier. Anything past this is
# truncated (logged loudly) before the LLM sees it. The default is
# comfortable for local quantised models (~5K tokens). Raise it when
# running a larger-context model and classification of long docs
# (contracts, research papers) matters more than the extra latency.
classify_max_chars = 20000

# How many PDF pages get attached to a single vision call. Each page
# costs ~1-3K input tokens at low render resolution, so the default
# of 5 leaves headroom on a 32K-context model. Raise to ~15-20 on an
# 80K-context model so longer scanned docs still get a full vision
# pass; lower if you see context-overflow errors.
vision_max_pdf_pages = 5

# Page cap for the LLM reformat (layout-recovery) pass on PDFs. Same
# token-budget reasoning as the vision cap; usually moves in lockstep.
reformat_max_pdf_pages = 5

# Forgejo organisation the archivist writes the shared knowledge vault
# (`<org>/memory`) under. The bot joins the org's Owners team so admins
# see the repo on their dashboard. The archivist always writes to this
# repo when the `code` stacklet is up; if Forgejo is unreachable, the
# write is skipped silently and the doc still lands in Paperless.
mirror_org = "family"

# Captures (URLs pasted in non-documents rooms) default to "bookmark"
# mode: only the LLM summary + tags + source URL are stored. Set
# `capture_keep_body = true` to also archive the extracted Markdown
# body alongside the digest — useful for content that might disappear
# or while experimenting with retrieval quality.
# Notes (pasted text) always keep the body regardless.
capture_keep_body = false
