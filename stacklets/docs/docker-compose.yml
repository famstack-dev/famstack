# stacklets/docs/docker-compose.yml — Paperless-ngx
#
# Family document archive with OCR. Drop a PDF, photo, or Office file
# and Paperless handles the rest: OCR, categorisation, and long-term archival.
#
# Five containers:
#   stack-docs-paperless  — web app + OCR engine (Tesseract via OCRmyPDF)
#   stack-docs-db         — PostgreSQL database
#   stack-docs-redis      — Redis/Valkey task queue (Celery)
#   stack-docs-gotenberg  — converts Office documents to PDF
#   stack-docs-tika       — extracts text from Office docs and email

name: stack-docs

services:
  stack-docs-paperless:
    container_name: stack-docs-paperless
    # Pinned to the 3.0 line, never `:latest`. A watchtower pull of
    # `:latest` once rolled 2.x straight to 3.0 and broke document filing.
    # Paperless migrates its database on the first 3.x start and 2.x will
    # not boot afterwards, so a major bump is one-way: do it deliberately,
    # with a backup taken first. Watchtower delivers the 3.0.x patches.
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0
    labels:
      - "com.centurylinklabs.watchtower.enable=${WATCHTOWER_ENABLE:-true}"
      - "stack.commit=${STACK_COMMIT:-unknown}"
    networks:
      - stack
    depends_on:
      stack-docs-db:
        condition: service_healthy
      stack-docs-redis:
        condition: service_healthy
      stack-docs-gotenberg:
        condition: service_started
      stack-docs-tika:
        condition: service_started
    volumes:
      - ${PAPERLESS_CONSUME}:/usr/src/paperless/consume
      - ${PAPERLESS_DATA_DIR}/media:/usr/src/paperless/media
      - ${PAPERLESS_DATA_DIR}/data:/usr/src/paperless/data
      - ${PAPERLESS_DATA_DIR}/export:/usr/src/paperless/export
    environment:
      PAPERLESS_DBHOST: stack-docs-db
      PAPERLESS_DBNAME: ${DB_NAME}
      PAPERLESS_DBUSER: ${DB_USER}
      PAPERLESS_DBPASS: ${DB_PASSWORD}
      PAPERLESS_REDIS: redis://stack-docs-redis:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://stack-docs-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://stack-docs-tika:9998
      PAPERLESS_SECRET_KEY: ${SECRET_KEY}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANG:-deu+eng}
      PAPERLESS_OCR_IMAGE_DPI: ${PAPERLESS_OCR_IMAGE_DPI:-300}
      PAPERLESS_ADMIN_USER: ${ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PAPERLESS_URL: ${PAPERLESS_URL}
      # Single sign-on through the stack's OIDC provider. PAPERLESS_APPS
      # is set only when a client id exists, so without a provider none
      # of this is active. The provider decides who exists, so a first
      # login may create the Paperless account (auto signup). Existing
      # local users are linked by verified email (EMAIL_AUTHENTICATION).
      # One entry: allauth resolves the app by client id during signup,
      # and a second entry with the same client id fails with a server
      # error. Paperless stores the provider_id on each linked account,
      # and existing accounts are linked as `pocketid`, so that id stays;
      # only the button label is neutral.
      PAPERLESS_APPS: ${OIDC_CLIENT_ID:+allauth.socialaccount.providers.openid_connect}
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"EMAIL_AUTHENTICATION":true,"EMAIL_AUTHENTICATION_AUTO_CONNECT":true,"APPS":[{"provider_id":"pocketid","name":"Sign in with family account","client_id":"${OIDC_CLIENT_ID}","secret":"${OIDC_CLIENT_SECRET}","settings":{"server_url":"${OIDC_ISSUER}/.well-known/openid-configuration"}}]}}'
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
      # New accounts join 'all_documents' (permissions.py keeps the group)
      PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS: all_documents
      PAPERLESS_OCR_MODE: skip
      # 2.x always rejected a re-uploaded identical file. 3.0 made that
      # conditional on this flag: with it unset the duplicate is consumed
      # anyway and the family ends up with two copies of the same letter.
      # Set it to keep "already filed" the answer, not a silent second copy.
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: 1
      PAPERLESS_OCR_OUTPUT_TYPE: pdfa
      PAPERLESS_FILENAME_FORMAT: "{created_year}/{created_month}/{created_year}-{created_month}-{created_day} {correspondent} - {title}"
    ports:
      - "${PORT_BIND_IP:-127.0.0.1}:42020:8000"
    restart: unless-stopped

  stack-docs-db:
    container_name: stack-docs-db
    image: postgres:16-alpine
    labels:
      - "com.centurylinklabs.watchtower.enable=${WATCHTOWER_ENABLE:-true}"
      - "stack.commit=${STACK_COMMIT:-unknown}"
    networks:
      - stack
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ${PAPERLESS_DB_DATA}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  stack-docs-redis:
    container_name: stack-docs-redis
    image: docker.io/valkey/valkey:8.1-alpine
    labels:
      - "com.centurylinklabs.watchtower.enable=${WATCHTOWER_ENABLE:-true}"
      - "stack.commit=${STACK_COMMIT:-unknown}"
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  stack-docs-gotenberg:
    container_name: stack-docs-gotenberg
    image: gotenberg/gotenberg:8.37
    labels:
      - "com.centurylinklabs.watchtower.enable=${WATCHTOWER_ENABLE:-true}"
      - "stack.commit=${STACK_COMMIT:-unknown}"
    networks:
      - stack
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    restart: unless-stopped

  stack-docs-tika:
    container_name: stack-docs-tika
    image: apache/tika:4.0.0
    labels:
      - "com.centurylinklabs.watchtower.enable=${WATCHTOWER_ENABLE:-true}"
      - "stack.commit=${STACK_COMMIT:-unknown}"
    networks:
      - stack
    restart: unless-stopped

networks:
  stack:
    external: true
