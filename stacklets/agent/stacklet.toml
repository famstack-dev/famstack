# stacklet.toml — the agent stacklet (the famstack family agent)
#
# The agent lives in the family's Matrix rooms. It answers from the family's own
# notes and wiki and can act through the stack CLI. It runs the nanobot harness
# in a container, connects to Matrix through nanobot's own channel as the agent
# account that the core bot-runner provisions from bot/bot.toml, and talks to the
# AI server configured in stack.toml [ai]: the local ai stacklet, another
# machine on the network, or a hosted provider (`stack ai switch <url>`).
#
# The stacklet is "agent"; the persona (name + voice) is configurable. It ships
# as "Stacky" via AGENT_NAME and a family can rename it (see the note below).

id          = "agent"
name        = "Agent"
description = "The family agent — ask it in chat, it answers from your own notes"
version     = "0.1.0"
category    = "ai"
# Beta: it answers, and its config can change between releases.
stage       = "beta"
requires    = ["messages"]
# It answers with the AI. With `[ai] provider = "none"` it waits for the AI:
# `stack up agent` refuses and `stack list` says `waits_for_ai`.
needs_ai    = true

# Image is built locally from the Dockerfile here (nanobot from PyPI). There is
# no upstream image to pull, so build on every `stack up`.
build = true

# The agent's own token for the host API: it opens the API's plaintext
# surface, never the JSON one that starts and stops stacklets. The API
# reads it from the secret store; the shim (client/stack) sends it.
# The audience key signs the people in a room for each memory read
# (`stack.agent_audience`): the runtime holds it, the API checks with it,
# and nanobot's exec tool never passes it to a command.
[env]
generate = ["STACK_API_TOKEN", "STACK_AUDIENCE_KEY"]

[env.defaults]
AGENT_DATA_DIR = "{data_dir}/agent"
# Persona — the family-facing name and voice, from stack.toml [agent] name
# (default "Stacky"). One knob: the same value drives the Matrix display name,
# the @<name>-bot handle, the #<name> room, and the SOUL.md self-reference.
AGENT_NAME = "{agent_name}"
# Who answers as the agent: "nanobot" (this container), or the id of a
# stacklet whose `bot/agent.py` the bot runner runs instead, while this
# container waits. `stack.toml [agent] runtime`.
AGENT_RUNTIME = "{agent_runtime}"
# Verbose runtime logs (tool calls, agent decisions). On while we build/debug.
AGENT_VERBOSE = "1"
# LLM — endpoint (docker-side URL), key, and model, all from stack.toml [ai].
AGENT_OPENAI_URL = "{ai_openai_url_docker}"
AGENT_OPENAI_KEY = "{ai_openai_key}"
AGENT_MODEL      = "{ai_default_model}"
# Speech to text for voice messages: the stack's Whisper, as the archivist uses
# it, in the household's language.
AGENT_WHISPER_URL   = "{ai_whisper_url_docker}"
AGENT_WHISPER_KEY   = "{ai_whisper_key}"
AGENT_WHISPER_MODEL = "{ai_whisper_model}"
AGENT_LANGUAGE      = "{language}"
# "true" with `[ai] speech = false`: the start takes the spoken twin out of
# the reminders skill, so no reminder runs `ai say` (runtime/speech_off.py).
AGENT_SPEECH_OFF    = "{ai_speech_off}"
# Matrix — nanobot logs in as @<agent_handle> against Synapse on the stack network.
AGENT_MATRIX_HOMESERVER  = "http://stack-messages-synapse:8008"
AGENT_MATRIX_SERVER_NAME = "{messages_server_name}"
# The agent's own Matrix handle, from [agent] name — nanobot logs in as
# @{agent_handle}. Same value the bot-runner provisions the account under.
AGENT_BOT_ID = "{agent_handle}"
# The agent's chat password, the secret its install writes and the bot-runner
# creates the account with. Only this one secret reaches the container: its
# shell and file tools can read any file there, so the stack's secret store
# is not mounted.
AGENT_MATRIX_PASSWORD = "{agent__AGENT_BOT_PASSWORD}"
TZ = "{timezone}"
