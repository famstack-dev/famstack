# stacklet.toml — messages stacklet (Matrix/Synapse + Element)
#
# The messaging backbone of famstack. Synapse is the Matrix homeserver,
# Element is the web client. Other stacklets send notifications through
# this — it's the nervous system of the stack.
#
# Federation is disabled by default — this is a LAN-only server for your
# household. The door stays open for federation if you use a real domain
# as the server_name.
#
# Three containers:
#   synapse            — Matrix homeserver (messages, accounts, media)
#   messages_postgres  — PostgreSQL database
#   element            — Element Web client (static web app)
#
# The server_name is permanent. It appears in every user ID (@user:name)
# and cannot be changed after setup. 'stack up messages' prompts for it
# on first run and stores it in stack.toml under [messages].

id          = "messages"
name        = "Messages"
description = "Family chat and notification backbone (Matrix + Element)"
version     = "0.2.1"
category    = "communication"
port        = 42030

# Next-step hints shown after 'stack up'. Template vars: {url}, {ip}
login_field = "username"

hints = [
    "Open {url} in your browser",
    "On phones: install Element, use http://{ip}:42031 as the server",
]

# Secondary ports — the main 'port' is Element (web client), but Synapse
# exposes its own API port for mobile apps and CLI tools. Declaring it here
# makes it discoverable from the manifest instead of hardcoded in plugins.
[ports]
element = 42030
synapse = 42031

[upstream]
image   = "matrixdotorg/synapse"
channel = "patch"

[env]
generate = ["DB_PASSWORD", "REGISTRATION_SECRET", "MACAROON_SECRET", "SCRIBE_BOT_PASSWORD"]

[env.defaults]
FAMSTACK_MESSAGES_SERVER_NAME = "{messages_server_name}"
SYNAPSE_DATA     = "{data_dir}/messages/synapse"
MESSAGES_DB_DATA = "{data_dir}/messages/postgres"
SYNAPSE_PUBLIC_URL = "{messages_synapse_url}"
TZ               = "{timezone}"
DB_USER          = "synapse"
DB_NAME          = "synapse"

[health]
url    = "http://localhost:42031/_matrix/client/versions"
expect = "200"

# Backup snapshot — the Matrix timeline, dumped consistently.
#
# The media store holds the family's actual voice recordings, but the
# database is what makes them messages: who spoke, in which room, when,
# and which media id belongs to which event. Without it the recordings
# are anonymous blobs.
#
# Postgres cannot be rsynced (its files change under you and a mid-write
# copy will not restore), so the backup stacklet dumps it instead and
# packs the dump with the files a homeserver cannot come back without:
# the signing key, which is its identity, and homeserver.yaml, whose
# macaroon secret keeps every existing login valid.
#
# pg_dump takes its own consistent view, so this runs against a live
# server with no downtime. A dump of this database compresses to a few
# hundred KB; the recordings themselves stay out of the tarball and ride
# the incremental archive path instead, so they are never re-copied and
# never subject to snapshot retention.
[[backup.snapshot]]
name     = "synapse"
postgres = { container = "stack-messages-db", database = "synapse", user = "synapse" }
include  = [
  "{data_dir}/messages/synapse/homeserver.yaml",
  "{data_dir}/messages/synapse/*.signing.key",
  "{data_dir}/messages/synapse/*.log.config",
]

# The recordings themselves. Append-only by construction: Synapse writes a
# media file once and never edits it, and famstack ships with both message
# and media retention disabled, so nothing here is ever purged.
#
# Only local_content — the originals. local_thumbnails regenerates from
# them, and url_cache is a cache of other people's web pages.
#
# Synapse does not create this directory until somebody sends the first
# photo or voice message, so on a new install the backup reports it as
# "nothing to back up yet" and carries on with everything else.
[[backup.archive]]
name      = "media"
path      = "{data_dir}/messages/synapse/media_store/local_content"
