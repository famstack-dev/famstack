# stacklets/messages/chat-port.nginx.conf: the front of the chat port (42031)
#
# The chat apps sign in at http://<mac>:42031. docker-compose.yml publishes
# that port from the Element container, whose nginx loads this file from
# /etc/nginx/conf.d/ next to the image's own server for Element Web, and
# passes every request to Synapse's plain HTTP listener as it came.
#
# Why a front at all: Element X on Android sends TLS hellos to the address
# before it speaks plain HTTP, also when the address starts with http://.
# Synapse reads a TLS hello as the start of a request line and waits for
# the rest, so each hello waits for the app's timeout (about 90 seconds)
# and the first sign-in takes minutes. nginx rejects a TLS hello at once
# with 400 Bad Request, because its first byte is no HTTP method. The app
# then falls back to plain HTTP within seconds.
#
# Why this nginx: the Element container runs it already and is part of the
# same stacklet, so the front adds no process and no image. In domain mode
# Caddy reaches Synapse directly (caddy.snippet); this port then listens on
# 127.0.0.1 only and serves the host's commands.

server {
    listen      8008;
    listen [::]:8008;

    # Docker's own DNS, asked at request time: nginx starts before Synapse
    # has an address, and follows Synapse when its container is recreated.
    resolver 127.0.0.11 valid=10s;
    set $synapse http://stack-messages-synapse:8008;

    location / {
        # With a variable and no URI part, nginx passes the request URI as
        # the client sent it. Matrix ids in paths stay percent-encoded.
        proxy_pass $synapse;

        # Synapse trusts these headers (x_forwarded in homeserver.yaml).
        # X-Forwarded-For is set to the address nginx sees, never appended
        # to, so a client cannot send its own X-Forwarded-For to Synapse.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Synapse holds the upload limit (max_upload_size). nginx checks no
        # size and streams both ways, so photos and videos are not held on
        # the container's disk on the way through.
        client_max_body_size    0;
        proxy_request_buffering off;
        proxy_buffering         off;

        # A client may ask Synapse to hold a request open: a sync long
        # poll waits up to the timeout the client asks for. nginx's
        # default of 60 seconds would cut a longer one with 504, so the
        # front waits as long as such a request may take.
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
}
