# stacklet.toml — memory stacklet (the persistent layer of the Family Brain)
#
# Memory keeps the stack's curated knowledge — the ontology, the facts,
# the wiki of entity pages. Data lives in Forgejo as a `memory` repo so
# the commit log doubles as the learning history: every fact added,
# every wiki edit, every reclassification is a diff you can revert.
#
# Memory is a host stacklet that *also* runs one container: the wiki,
# a Quartz site that renders the vault as a browsable, mobile-friendly
# wiki. The hooks still own the data plane (clone, pull, push); the
# container is a derived, read-only view that watches the bind-mounted
# working copy and rebuilds on change. There is one source of truth
# (Forgejo) — the wiki is just a nicer pair of eyes on it.
#
# Edits still happen in Forgejo: the wiki renders pages with an
# "edit on Forgejo" link, so every change lands as a real commit.

id          = "memory"
name        = "Memory"
description = "Persistent knowledge — ontology, facts, and wiki — backed by Forgejo"
version     = "0.4.0"
category    = "infrastructure"
type        = "host"
requires    = ["code"]

# The wiki container is built locally from the Dockerfile in this
# directory — there is no upstream image to pull. `build = true` tells
# the runtime to `docker compose build` on every `stack up`, so config
# tweaks (`quartz/*.ts`) land without manual image management.
build = true

# The Forgejo write token every host-side vault write needs. It is minted
# during install and stored as a secret; `stack doctor` reports it missing
# so an instance that predates the token (or lost it with a rebuilt code
# stacklet) says so plainly instead of failing one write at a time.
required_secrets = ["MEMORY_BOT_TOKEN"]

# LAN port for the wiki's Quartz preview server. Sits at the end of
# the 42xxx range used by other stacklets so future infra ports stay
# easy to scan.
port = 42070

hints = [
    "Read the family wiki at {url}",
    "Edit pages in Forgejo (`family/memory` repo) — every save is a commit",
]

# Host-side env vars are read by the install / start hooks (they run on
# the host and talk to Forgejo over HTTP). Container-side env vars are
# read by the wiki through `env_file: .env`. Both surfaces share this
# table — names that don't apply to a given surface are simply ignored.
[env.defaults]
CODE_URL       = "{code_url}"
ADMIN_USER     = "{admin_username}"
ADMIN_PASSWORD = "{admin_password}"
# Slug for the bucket inside the vault that holds institutional
# artifacts (documents, correspondents). Personal entities (homer,
# marge, ...) live at <vault>/<localpart>/. Sourced from stack.toml
# [core] shared_bucket, defaults to "family".
SHARED_BUCKET  = "{shared_bucket}"

# The memory source clone (`memory.lib.vault_path_for`): the curator
# pulls it and reads source, the wiki CLI reads source from it. Never
# written by generation — memory is source-only.
MEMORY_VAULT_DIR = "{data_dir}/memory/vault"

# The brain projection working copy (`memory.lib.brain_path_for`): the
# curator mirrors memory's source plus generated pages into it and
# pushes; Quartz mounts and renders it. Disposable — rebuilt from
# memory at any time.
BRAIN_REPO_DIR = "{data_dir}/memory/brain"

# The media archive: the originals behind the pages, kept as plain
# dated files. Its own store rather than a folder inside brain, because
# brain is a projection that can be deleted and rebuilt at any time and
# these bytes cannot be rebuilt from anything. The wiki container
# mounts it into the rendered tree so pages can address it.
MEDIA_ARCHIVE_DIR = "{data_dir}/memory/media"

# Bind-mount source for the curator sidecar: the memory data dir as a
# whole, so one mount covers the source clone, the brain working copy,
# and the curator's state files at the same /data/memory paths the
# containers expect.
MEMORY_DATA_DIR = "{data_dir}/memory"

# What the diary compiler remembers between runs: the model's reading of
# each message and the paragraph opening each month. Not a record of how
# far it got -- the compiler re-reads the whole room every time, because
# a reply or an edit can land on an entry from years back. These are a
# cache of what each piece cost, so a nightly pass pays only for what is
# new.
DIARY_STATE_DIR = "{data_dir}/memory/diary"

# The shared transcript cache, written by the bots and read by the diary
# backfill. Same directory core gives the bot-runner: whisper costs
# minutes of GPU per recording and neither side should pay twice.
CORE_DATA_DIR = "{data_dir}/core"

# Curator runtime — the slim sidecar runs the same wiki generation the
# CLI does, so it needs the LLM endpoint (docker-side), model config,
# Forgejo admin credentials (CODE_URL is overridden to the container-
# network address in docker-compose.yml), language, and timezone.
OPENAI_URL       = "{ai_openai_url_docker}"
OPENAI_KEY       = "{ai_openai_key}"
AI_DEFAULT_MODEL = "{ai_default_model}"
AI_MODELS_JSON   = "{ai_models_json}"
LANGUAGE         = "{language}"
# The memories room the diary compiler reads, and the whisper endpoint
# it decodes recordings with. Same values core gives the bot-runner:
# the curator runs the compiler on its nightly sweep, so it needs them
# too. The literal homeserver address resolves on the stack network
# whether or not messages was installed first.
MATRIX_HOMESERVER  = "http://stack-messages-synapse:8008"
MATRIX_SERVER_NAME = "{messages_server_name}"
WHISPER_URL        = "{ai_whisper_url_docker}/audio/transcriptions"

TIMEZONE         = "{timezone}"
MATRIX_ADMIN_USER     = "{admin_username}"
MATRIX_ADMIN_PASSWORD = "{admin_password}"

# Wiki freshness knobs (stack.toml [memory]). Incremental rebuilds run
# after the vault has been quiet for the debounce window, so a stack
# of documents filed in one go produces one rebuild, not one per
# document. The nightly full sweep ("HH:MM" local, empty disables) is
# the self-healing catch-all for topic pages and cross-references.
WIKI_AUTO_REBUILD       = "{wiki_auto_rebuild}"
WIKI_REBUILD_QUIET_SECS = "{wiki_rebuild_quiet_secs}"
WIKI_NIGHTLY            = "{wiki_nightly}"

# Public hostname the wiki renders into absolute URLs (sitemap,
# social cards, etc). Empty domain (port mode) falls back to the
# auto-detected LAN IP via `{ip}` so the site stays reachable.
WIKI_HOST = "wiki.{domain}"
WIKI_IP   = "{ip}"

# What the wiki calls itself, in the sidebar and the browser tab: the
# household's own name from stack.toml [core] stack_owner, rendered as
# "The Simpsons". Empty on instances installed before stack_owner
# existed, and the wiki falls back to a generic title rather than show a
# half-written name.
WIKI_TITLE = "{family_display_name}"

# Backup source. Every other irreplaceable store in the stack declares
# one of these; this one is the first in memory because everything else
# here is a git repo with a copy in Forgejo. The archive is excluded
# from git on purpose, so git is not its second copy and without this
# entry it would have none.
[[backup.archive]]
name      = "media"
path      = "{data_dir}/memory/media"
