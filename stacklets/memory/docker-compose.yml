# stacklets/memory/docker-compose.yml — the family wiki
#
# Two services. The "wiki" is a Quartz v4 site that renders the
# family memory vault as a browsable wiki: graph view, backlinks,
# full-text search, mobile-friendly. The container runs `quartz
# build --serve`, which watches the bind-mounted vault and rebuilds
# whenever files change. The "curator" is the vault keeper: it owns
# the `git pull` that keeps the working copy in sync with Forgejo,
# and regenerates wiki pages when filings land (see bot/curator.py).
#
# Forgejo stays the canonical source of truth; the wiki mounts the
# vault read-only and never touches git. Both images are built
# locally and Watchtower is told to ignore them (no upstream images
# to track).

name: stack-memory

services:
  stack-memory-wiki:
    container_name: stack-memory-wiki
    build:
      context: .
      dockerfile: Dockerfile
    image: stack-memory-wiki:local
    # Locally-built image — nothing for Watchtower to pull. The Quartz
    # version is pinned in the Dockerfile and bumped by hand.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - stack
    # Read-only: the wiki is a pure view. The curator below owns the
    # pull; edits round-trip through Forgejo and land as commits.
    volumes:
      - ${MEMORY_VAULT_DIR}:/vault:ro
    environment:
      # Used by quartz.config.ts to build "edit on Forgejo" links and
      # absolute URLs. Resolved by the runtime from stack.toml.
      CODE_URL: ${CODE_URL}
      WIKI_HOST: ${WIKI_HOST}
      WIKI_IP: ${WIKI_IP}
      WIKI_PORT: "42070"
    ports:
      # Container's Quartz preview server listens on 8080; we publish
      # on the stacklet's declared port (42070). PORT_BIND_IP is set
      # by the runtime — 0.0.0.0 in port mode, 127.0.0.1 in domain mode
      # so Caddy is the only path in.
      - "${PORT_BIND_IP:-127.0.0.1}:42070:8080"
    restart: unless-stopped

  # Curator — the vault keeper. Owns the `git pull` from Forgejo,
  # runs debounced incremental rebuilds (member pages + home) after
  # filings settle, plus a nightly full sweep as the self-healing
  # catch-all. Own slim image (python + git + the LLM client deps) —
  # see curator.Dockerfile; code arrives by bind mount like the
  # bot-runner's, the env is memory's own. See `bot/curator.py`.
  stack-memory-curator:
    container_name: stack-memory-curator
    build:
      context: .
      dockerfile: curator.Dockerfile
    image: stack-memory-curator:local
    # Locally-built image — nothing for Watchtower to pull.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - stack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # In-container paths: the vault working copy (read-only use; the
      # wiki container owns the pull) and the curator's state files,
      # both under the /data/memory mount below.
      MEMORY_VAULT_DIR: /data/memory/vault
      CURATOR_STATE_DIR: /data/memory/curator
      # Forgejo, container-network address — memory's own CODE_URL in
      # .env is the host-side URL the install hooks use.
      CODE_URL: http://stack-code:3000
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD}
      # LLM endpoint (docker-side URL) + model config for the wiki
      # generation the curator subprocesses.
      OPENAI_URL: ${OPENAI_URL}
      OPENAI_KEY: ${OPENAI_KEY}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL}
      AI_MODELS_JSON: ${AI_MODELS_JSON}
      LANGUAGE: ${LANGUAGE}
      SHARED_BUCKET: ${SHARED_BUCKET}
      # Behavior — rendered from stack.toml [memory].
      WIKI_AUTO_REBUILD: ${WIKI_AUTO_REBUILD:-true}
      WIKI_REBUILD_QUIET_SECS: ${WIKI_REBUILD_QUIET_SECS:-180}
      WIKI_NIGHTLY: ${WIKI_NIGHTLY:-03:30}
      # Local time for WIKI_NIGHTLY.
      TZ: ${TIMEZONE:-UTC}
    volumes:
      # Code mounts, same shape as the bot-runner's: curator.py + the
      # wiki module from /stacklets, the framework from /app/stack.
      - ../../stacklets:/stacklets:ro
      - ../../lib/stack:/app/stack:ro
      # Vault working copy (the curator pulls it) + state dir.
      - ${MEMORY_DATA_DIR}:/data/memory
    restart: unless-stopped

networks:
  stack:
    external: true
