# ontology.toml — family ontology shipped by famstack
#
# This is the seed the memory stacklet pushes to the Forgejo `memory`
# repo on first install. From then on, the instance owns the live copy:
# hand edits in Forgejo (or a local Obsidian clone) are first-class and
# appear in the commit log alongside system-generated additions.
#
# Schema is documented in lib/stack/ontology.py:
#   [topic.<id>]  names = { <lang> = "..." }
#                 synonyms = { <lang> = ["..."] }   # optional
#                 keywords = { <lang> = ["..."] }   # optional
#                 types    = ["<doctype_id>", ...]  # optional cross-ref
#                 area     = "<area_id>"             # optional, wiki navigation
#
#   [area.<id>]   names = { <lang> = "..." }       # a group of topics in the sidebar
#
#   [doctype.<id>]  names = { <lang> = "..." }
#                   synonyms = { <lang> = ["..."] }  # optional
#
# Every entry here must mirror a name in stacklets/docs/taxonomy.toml.
# tests/unit/stacklets/test_ontology_taxonomy_sync.py enforces no-drift in
# both directions.

# ──────────────────────────────────────────────────────────────────────
# Topics — what the document or fact is *about*.
# ──────────────────────────────────────────────────────────────────────

[topic.insurance]
names    = { de = "Versicherung", en = "Insurance" }
area     = "contracts"
synonyms = { de = ["Versicherungspolice"], en = ["policy", "coverage"] }
keywords = { de = ["versichert", "Schadensfall", "Beitrag", "Selbstbeteiligung"], en = ["insured", "claim", "premium", "deductible"] }
types    = ["policy", "invoice", "letter", "statement"]

[topic.finance]
names    = { de = "Finanzen", en = "Finance" }
area     = "money"
synonyms = { en = ["banking"] }
keywords = { de = ["Bank", "Konto", "Überweisung"], en = ["bank", "account", "transfer", "balance"] }
types    = ["statement", "letter"]

[topic.investments]
names    = { de = "Investments", en = "Investments" }
area     = "money"
synonyms = { de = ["Wertpapiere", "Aktien"], en = ["stocks", "portfolio", "securities"] }
types    = ["statement", "letter"]

[topic.income]
names    = { de = "Einkommen", en = "Income" }
area     = "money"
synonyms = { en = ["salary", "wages"] }
types    = ["pay_slip", "statement"]

[topic.tax]
