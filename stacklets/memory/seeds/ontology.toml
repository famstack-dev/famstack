synonyms = { de = ["Miete"], en = ["rent", "mortgage"] }
keywords = { de = ["Vermieter", "Hausverwaltung", "Mietvertrag", "Hauptwohnsitz", "Betriebskostenabrechnung", "Wohnungsübergabe", "Hausordnung", "Nebenkosten"], en = ["landlord", "lease", "rental agreement", "primary residence", "utility bill", "tenancy"] }
types    = ["contract", "invoice", "statement", "letter"]

[topic.property]
names = { de = "Immobilien", en = "Property" }
synonyms = { de = ["Grundbuch"], en = ["real estate", "deed"] }
