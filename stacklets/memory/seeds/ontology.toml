keywords = { de = ["Anreise", "Abreise", "Aufenthalt", "Übernachtung", "Hotel", "Pension", "Chalet", "Ferienwohnung", "Ferienhaus", "Unterkunft", "Reservierung", "Buchungsbestätigung", "Check-in", "Check-out"], en = ["hotel", "chalet", "vacation rental", "holiday home", "lodging", "accommodation", "check-in", "check-out", "booking confirmation", "stay"] }
types = ["booking", "invoice"]

