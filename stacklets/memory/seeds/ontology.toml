area     = "money"
synonyms = { en = ["taxation"] }
keywords = { de = ["Steuererklärung", "Abzug"], en = ["return", "deduction"] }
types    = ["tax_assessment", "letter", "notice"]

[topic.tax_office]
names = { de = "Finanzamt", en = "Tax Office" }
area     = "money"
types = ["letter", "notice", "tax_assessment"]

[topic.medical]
names    = { de = "Gesundheit", en = "Medical" }
area     = "health"
synonyms = { de = ["Arzt"], en = ["health", "healthcare"] }
keywords = { de = ["Diagnose", "Behandlung", "Rezept"], en = ["diagnosis", "treatment", "prescription"] }
types    = ["medical_certificate", "prescription", "invoice", "letter"]

[topic.education]
names = { de = "Bildung", en = "Education" }
area     = "kids"
synonyms = { de = ["Schule", "Universität"], en = ["school", "university", "training"] }
types = ["certificate", "letter", "invoice"]

[topic.child]
names = { de = "Kind", en = "Child" }
area     = "kids"
synonyms = { de = ["Kinder"], en = ["children", "kids"] }

[topic.toys]
# Subject side -- what the document is about. The shape (assembly
# instructions, warranty card, receipt) lives in `types`; keywords
# stay off this entry because terms like "Bauanleitung" or
# "Modellnummer" appear on furniture manuals and e-commerce
# invoices too. Names + synonyms + a Lego brand mention in the
# body give the classifier enough to land on Toys.
names    = { de = "Spielzeug", en = "Toys" }
area     = "kids"
synonyms = { de = ["Spielware"], en = ["toy"] }
types    = ["manual", "warranty", "receipt", "invoice"]

[topic.games]
# Board games, card games, rule sheets. `doctype.manual` covers the
# shape (the UNO rules sheet is a Manual / Spielanleitung); this
# topic carries the subject so retrieval like "where is the UNO
# rule for the wild draw four" finds the right mirror.
names    = { de = "Spiele", en = "Games" }
area     = "kids"
synonyms = { de = ["Brettspiel", "Kartenspiel"], en = ["board game", "card game"] }
types    = ["manual"]

[topic.marriage]
names = { de = "Ehe", en = "Marriage" }
area     = "official"
types = ["certificate", "personal_record"]

[topic.vehicle]
names    = { de = "Fahrzeug", en = "Vehicle" }
area     = "car"
synonyms = { de = ["Auto"], en = ["car", "automobile"] }
keywords = { de = ["TÜV", "KFZ"], en = ["registration", "inspection"] }
types    = ["contract", "invoice", "certificate"]

[topic.housing]
