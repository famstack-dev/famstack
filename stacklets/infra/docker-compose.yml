# infra/docker-compose.yml — domain mode infrastructure
#
# AdGuard: DNS server, resolves *.domain → server IP
# Caddy: reverse proxy, routes by hostname to containers
#
# For domain mode:
#   1. AdGuard resolves *.home.internal → server IP
#   2. Caddy routes by hostname to the right container
#   3. Point your router's DNS to this server

name: stack-infra

services:

  # ── AdGuard Home ─────────────────────────────────────────────────────────────
  # DNS server with ad-blocking. Provides wildcard DNS for domain mode.
  # First run: complete setup wizard at http://localhost:42081
  # After setup: admin panel at http://ip:42080
  stack-infra-adguard:
    image: adguard/adguardhome:latest
    container_name: stack-infra-adguard
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "stack.commit=${STACK_COMMIT:-unknown}"
    networks:
      - stack
    ports:
      # DNS (must be 53 for network clients). Every device on the LAN asks
      # here, so it binds all interfaces. PORT_BIND_IP is 127.0.0.1 in
      # domain mode, the one mode this stacklet runs in.
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:53:53/tcp"
      # Setup wizard (first run)
      - "${PORT_BIND_IP:-0.0.0.0}:42081:3000"
      # Admin panel (after setup)
      - "${PORT_BIND_IP:-0.0.0.0}:42080:80"
    volumes:
      - ${ADGUARD_DATA_DIR}/work:/opt/adguardhome/work
      - ${ADGUARD_DATA_DIR}/conf:/opt/adguardhome/conf
    environment:
      TZ: ${TZ}

  # ── Caddy ──────────────────────────────────────────────────────────────────
  # Reverse proxy. Routes requests by hostname to the right container, from
  # the Caddyfile the stack CLI assembles out of every running stacklet's
  # caddy.snippet. Built with the DNS provider plugins (see Dockerfile).
  stack-infra-caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: stack-infra-caddy:local
    container_name: stack-infra-caddy
    restart: unless-stopped
    # Locally-built image, nothing for Watchtower to pull. `stack up infra`
    # rebuilds it.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "stack.commit=${STACK_COMMIT:-unknown}"
    networks:
      - stack
    ports:
      # The front door for every device on the LAN, so it binds all
      # interfaces. PORT_BIND_IP (127.0.0.1 in domain mode) keeps the
      # services behind the proxy off the LAN, not the proxy itself.
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      - STACK_DOMAIN=${STACK_DOMAIN:-home.internal}
      # Read by the Caddyfile's DNS challenge as {env.DNS_API_TOKEN}.
      - DNS_API_TOKEN=${DNS_API_TOKEN:-}
    volumes:
      - ${CADDYFILE_PATH}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR}:/data
      - caddy-config:/config

volumes:
  caddy-config:

networks:
  stack:
    external: true
