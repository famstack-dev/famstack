# Minimal container for integration testing.
# Alpine + busybox httpd — starts in ~1 second, serves health check.

name: stack-test

services:
  stack-test:
    container_name: stack-test
    image: alpine:latest
    # A list, not a string: compose splits a string command itself and
    # drops the backslashes, which left the response without line breaks.
    command:
      - sh
      - -c
      - |
        while true; do
          printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 8080
        done
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - stack
    ports:
      - "${PORT_BIND_IP:-127.0.0.1}:42099:8080"
    volumes:
      - ${TEST_DATA_DIR}:/data
    environment:
      TZ: ${TZ}
      TEST_SECRET: ${TEST_SECRET}
      TEST_ADMIN: ${TEST_ADMIN}
    restart: unless-stopped

networks:
  stack:
    external: true
