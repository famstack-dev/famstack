# Minimal container for integration testing.
# Alpine + busybox nc, starts in about a second, answers the health check.
# `TEST_FAIL=health` in the environment of `stack up` makes it answer 500.

name: stack-test

services:
  stack-test:
    container_name: stack-test
    image: alpine:latest
    # A list, not a string: compose splits a string command itself and
    # drops the backslashes, which left the response without line breaks.
    command:
      - sh
      - -c
      # `$$` is a `$` for the shell; compose would read `$` itself.
      - |
        status="200 OK"
        [ "$$TEST_FAIL" = health ] && status="500 Internal Server Error"
        while true; do
          printf 'HTTP/1.1 %s\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' "$$status" | nc -l -p 8080
        done
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - stack
    ports:
      - "${PORT_BIND_IP:-127.0.0.1}:42099:8080"
    volumes:
      - ${TEST_DATA_DIR}:/data
    environment:
      TZ: ${TZ}
      TEST_SECRET: ${TEST_SECRET}
      TEST_ADMIN: ${TEST_ADMIN}
      # From the environment `stack up` runs in, not from .env: off unless set.
      TEST_FAIL: ${TEST_FAIL:-}
    restart: unless-stopped

networks:
  stack:
    external: true
