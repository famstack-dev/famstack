# Test instance config — a dedicated stack for integration tests.
#
# Points at an isolated data dir and a fake LLM endpoint. Shares
# stacklets/ with the dev instance (via STACK_DIR pointing here).
# The test family (users.toml) is the Simpsons — easier to reason
# about than abstract test users.

[core]
name          = "stack"
domain        = ""
data_dir      = "~/famstack-test-data"
timezone      = "Europe/Berlin"
language      = "en"
# Memory vault's institutional bucket — documents and correspondents
# live under <vault>/family/. Personal captures (Homer, Bart, ...) live
# at <vault>/<localpart>/. Defaults to "family" if unset.
shared_bucket = "family"

[updates]
schedule = "0 0 3 * * *"

[ai]
# AI backend. Flip with `tests/integration/stacktests ai [mock|local|external]`.
# mock points at the pytest-httpserver stub the `openai` fixture starts;
# local/external endpoints come from the environment, never committed.
openai_url = "http://localhost:42199/v1"
openai_key = "test"
default    = "test-model"
language   = "en"

[messages]
# Server name is permanent in every Matrix user ID (@homer:simpson).
# Pre-set here so `stack up messages` skips the interactive prompt.
server_name = "simpson"
