    truth: Lisa did not want to sleep outside because of the insects at the lake.
    body: |
      Two nights at Lake Springfield. Marge drove, we were there by four.

      Lisa refused to sleep in the tent after dark. The mosquitoes near
      the reeds were unbearable and she had bites on both arms by the
      second evening. She slept in the car instead.

      Next time: a net for the tent door, and a pitch away from the water.

