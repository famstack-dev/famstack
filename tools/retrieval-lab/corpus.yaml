# The fabricated vault the retrieval lab measures against.
#
# Each entry under `facts` is one page the family wrote, plus a `truth`
# line stating what actually happened. The page prose and the truth line
# are written to disagree in wording on purpose: the truth is what a
# family member remembers, the body is what somebody typed at the time.
# `goldset.yaml` is written from the truth lines alone, never from the
# bodies, so a query is not quietly reverse-engineered from the text it
# is supposed to find.
#
# German pages carry real umlauts, because that is what a family types.
# Queries in the gold set sometimes do not -- a phone keyboard, a hurry,
# an English layout -- and whether the engine survives that is one of
# the things being measured.
#
# Simpsons only, half German, as the rest of the demo data is. Nothing
# here comes from a real household.

persons: [homer, marge, bart, lisa, maggie]

facts:
